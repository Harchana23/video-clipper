{% extends "base.html" %}
{% block title %}Sign in · Clipper{% endblock %}
{% block body %}
<form class="login" method="post" action="/login">
  <div class="logo">✂ Clipper</div>
  <input class="in" type="password" name="password" placeholder="Admin password" autocomplete="current-password" autofocus required>
  {% if error %}<div class="msg err" role="alert">{{ error }}</div>{% endif %}
  <button class="btn" type="submit">Sign in</button>
  <div class="small">Stays signed in on this device for 30 days.<br>After 5 wrong tries, it waits 15 minutes.</div>
</form>
{% endblock %}
